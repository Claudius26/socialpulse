<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon (browser tab) — the SocialPulse logo mark. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="SocialPulse Global — your global partner for digital solutions: virtual numbers, social media boost, proxies, and pay bills & utilities in one platform."
    />

    <!-- Open Graph / Twitter — the logo + text shown when the link is shared
         (WhatsApp, Snapchat, Facebook, X, etc.). og:image must be an ABSOLUTE
         URL for social scrapers to fetch it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SocialPulse Global" />
    <meta property="og:title" content="SocialPulse Global — Your Global Partner for Digital Solutions" />
    <meta
      property="og:description"
      content="Virtual numbers, social media boost, proxies, and pay bills & utilities — all in one platform."
    />
    <meta property="og:url" content="https://socialpulseglobal.com/" />
    <meta property="og:image" content="https://socialpulseglobal.com/favicon.png" />
    <meta property="og:image:alt" content="SocialPulse Global logo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SocialPulse Global — Your Global Partner for Digital Solutions" />
    <meta
      name="twitter:description"
      content="Virtual numbers, social media boost, proxies, and pay bills & utilities — all in one platform."
    />
    <meta name="twitter:image" content="https://socialpulseglobal.com/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>SocialPulse Global — Your Global Partner for Digital Solutions</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
